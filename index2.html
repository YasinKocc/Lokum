<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lokum: Büyük Risk</title>
    <link rel="icon" href="lokum.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,700;0,900;1,400&family=Anton&display=swap"
        rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-purple: #2c2f73;
            --header-purple: #35398e;
            --deep-purple: #1a1c4b;
            --accent-red: #c41821;
            --text-white: #ffffff;
            --bg-color: #f4f4f4;
            --success-green: #00cc66;
            --font-main: 'Source Sans 3', sans-serif;
            --font-display: 'Anton', 'Poplar Std Black', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--deep-purple);
            color: #333;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Animations --- */
        @keyframes bounce-green {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes shake-red {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* --- Header --- */
        header {
            flex: 0 0 auto;
            background: var(--primary-purple);
            border-bottom: 4px solid var(--accent-red);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            color: var(--text-white);
            text-shadow: 2px 2px 0px var(--accent-red);
            cursor: pointer;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-red);
            text-shadow: none;
        }

        /* --- Main Content --- */
        main {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .view-section {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .view-section.active {
            display: flex;
        }

        /* --- Game Board --- */
        .game-board {
            flex: 1;
            display: grid;
            gap: 4px;
            padding: 4px;
            background: var(--deep-purple);
            width: 100%;
            height: 100%;
        }

        .category-card {
            background: var(--header-purple);
            color: white;
            text-align: center;
            font-family: var(--font-display);
            font-size: clamp(14px, 2vw, 28px);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px black;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #5d5dff;
            word-break: break-word;
            padding: 5px;
            z-index: 2;
        }

        .clue-card {
            background: var(--primary-purple);
            color: var(--accent-red);
            font-family: var(--font-display);
            font-size: clamp(24px, 4vw, 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 2px 2px 0px black;
            border: 2px solid #4a4e9e;
        }

        .clue-card:hover {
            background: #363b8c;
            transform: scale(1.02);
            z-index: 5;
        }

        .clue-card.disabled {
            background: #202255;
            color: #2a2d60;
            cursor: default;
            pointer-events: none;
            border-color: #202255;
            text-shadow: none;
        }

        /* --- Scoreboard --- */
        .score-board {
            flex: 0 0 auto;
            height: 18vh;
            min-height: 100px;
            background: var(--deep-purple);
            border-top: 5px solid var(--accent-red);
            display: flex;
            width: 100%;
            z-index: 20;
        }

        .score-teams-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .score-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--primary-purple);
            border-right: 2px solid rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .score-team:last-child {
            border-right: none;
        }

        .score-team:nth-child(even) {
            background: #262966;
        }

        .score-team span:first-child {
            font-family: var(--font-main);
            font-weight: bold;
            font-size: clamp(12px, 1vw, 16px);
            color: #ddd;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-val {
            font-family: var(--font-display);
            font-size: clamp(30px, 4vw, 50px);
            color: var(--accent-red);
            text-shadow: 2px 2px 0 black;
            line-height: 1;
            margin: 2px 0;
            transition: transform 0.15s ease;
        }

        .score-adjust-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: clamp(16px, 2vw, 30px);
            cursor: pointer;
            padding: 0;
            margin: 0;
            line-height: 1;
            transition: all 0.1s;
        }

        .score-adjust-btn:hover {
            color: white;
            transform: scale(1.3);
        }

        .score-adjust-btn:active {
            transform: scale(0.9);
        }

        .score-adjust-btn.plus:hover {
            color: var(--success-green);
        }

        .score-adjust-btn.minus:hover {
            color: var(--accent-red);
        }

        /* --- Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 60, 0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--primary-purple);
            color: white;
            width: 100%;
            max-width: 1000px;
            max-height: 95vh;
            overflow-y: auto;
            border: 4px solid var(--text-white);
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .timer-container {
            display: none;
            margin-bottom: 20px;
            align-items: center;
            flex-direction: column;
            gap: 10px;
        }

        .timer-display {
            font-family: var(--font-display);
            font-size: 6rem;
            color: white;
            background: var(--accent-red);
            padding: 5px 50px;
            border-radius: 15px;
            border: 5px solid white;
            text-shadow: 4px 4px 0 black;
            min-width: 240px;
            box-shadow: 0 10px 0 #900;
        }

        .timer-warning {
            animation: shake-red 0.5s infinite;
            background: #ff3333;
        }

        .modal-text {
            font-family: var(--font-display);
            font-size: 3.5rem;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 2rem;
            text-shadow: 4px 4px 0px black;
        }

        .modal-answer {
            font-family: var(--font-main);
            font-size: 2.5rem;
            color: var(--accent-red);
            margin-bottom: 2rem;
            display: none;
            font-weight: bold;
            background: white;
            color: black;
            padding: 15px 30px;
            border-radius: 8px;
            border: 4px solid var(--accent-red);
        }

        /* --- Yeni Seçmeli Skorlama --- */
        .modal-scoring {
            display: none;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .modal-score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .team-toggle-btn {
            width: 100%;
            padding: 20px 10px;
            font-family: var(--font-display);
            font-size: 1.8rem;
            background: rgba(0, 0, 0, 0.6);
            color: #ccc;
            border: 4px solid #555;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team-toggle-btn.selected {
            background: var(--success-green);
            color: white;
            border-color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 204, 102, 0.5);
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
        }

        .team-toggle-btn:hover {
            filter: brightness(1.2);
        }

        .btn {
            font-family: var(--font-display);
            padding: 15px 35px;
            font-size: 1.5rem;
            background: var(--accent-red);
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
            border: 3px solid rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .btn:hover {
            background: #d61f29;
            transform: scale(1.02);
        }

        .btn-correct {
            background-color: var(--success-green);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        /* Builder Styles */
        .builder-container {
            background: white;
            padding: 2rem;
            overflow-y: auto;
            height: 100%;
            max-width: 1200px;
            margin: 2rem auto;
        }

        .category-row,
        .questions-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            font-family: var(--font-main);
            font-size: 1rem;
        }

        .q-cell {
            background: #f0f0f0;
            padding: 10px;
            border: 2px solid #ddd;
        }

        /* Home Styles */
        .hero {
            text-align: center;
            margin-top: 1%;
            padding: 50px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            border: 5px solid var(--primary-purple);
            box-shadow: 15px 15px 0 rgba(0, 0, 0, 0.2);
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            color: var(--primary-purple);
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--accent-red);
            letter-spacing: 2px;
        }

        .list-header {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--primary-purple);
            border-bottom: 2px solid var(--primary-purple);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .list-arrow-icon.rotated {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3.5rem;
            }

            .btn-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .category-card {
                font-size: 3vw;
            }

            .clue-card {
                font-size: 5vw;
            }

            .score-val {
                font-size: 2rem;
            }

            .score-adjust-btn {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo" onclick="app.showView('home')">
            Lokum: <span>Büyük Risk</span>
        </div>
    </header>
    <main>
        <!-- VIEW: HOME -->
        <div id="view-home" class="view-section active">
            <div class="hero">
                <h1>Lokum: Büyük Risk</h1>
                <div class="btn-group">
                    <button class="btn" onclick="app.createNewGame()">Oluştur</button>
                    <button class="btn btn-secondary" onclick="app.loadHardcodedDemo()">Örnek Oyun Oyna</button>
                </div>
                <div style="margin-top: 30px; font-size: 1rem; color: #555;">
                    <p>Cloud oyunlarla oynamak için aşağıdaki butona tıklayın.</p>
                    <button id="btn-cloud-list" onclick="app.toggleGameList()"
                        style="background:none; border:none; cursor:pointer; color: #aaa; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:5px;">
                        <span>Kayıtlı Oyunları Listele (Cloud)</span>
                        <span id="arrow-icon" class="material-symbols-outlined">list</span>
                    </button>
                </div>
                <div id="local-games-list"
                    style="margin-top: 20px; text-align: left; max-height: 200px; overflow-y: auto; display:none;">
                </div>
            </div>
        </div>
        <!-- VIEW: BUILDER -->
        <div id="view-builder" class="view-section">
            <div class="builder-container">
                <h2 style="font-family: var(--font-display); color: var(--primary-purple); font-size: 2rem;">Oyun
                    Oluşturucu</h2>
                <div
                    style="display:flex; gap:15px; margin-bottom:30px; flex-wrap:wrap; background:#eee; padding:15px; border-radius:8px;">
                    <div>
                        <label style="font-weight:bold">Kategori:</label>
                        <input type="number" id="cat-count" value="5" min="1" max="6" style="width:70px"
                            onchange="app.handleDimChange()">
                    </div>
                    <div>
                        <label style="font-weight:bold">Satır:</label>
                        <input type="number" id="row-count" value="5" min="1" max="6" style="width:70px"
                            onchange="app.handleDimChange()">
                    </div>
                    <div>
                        <label style="font-weight:bold">Takım:</label>
                        <input type="number" id="team-count" value="4" min="1" max="20" style="width:70px">
                    </div>
                    <div style="margin-left:auto">
                        <button class="btn" onclick="app.saveAndPlayGame()">Cloud'a Kaydet ve Oyna</button>
                    </div>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="font-weight:bold">Oyun Adı:</label>
                    <input type="text" id="game-title" value="Yeni Oyun" style="font-size:1.2rem;">
                </div>
                <div id="builder-grid-area"></div>
            </div>
        </div>
        <!-- VIEW: GAME -->
        <div id="view-game" class="view-section" style="width: 100%;">
            <div class="game-board" id="game-grid"></div>
        </div>
    </main>
    <!-- SCOREBOARD -->
    <div class="score-board" id="score-board" style="display: none;">
        <div id="score-container" class="score-teams-container"></div>
    </div>
    <button id="btn-edit-float" class="btn btn-secondary" onclick="app.prepareEditForBuilder()"
        style="display:none; position:fixed; bottom: 20vh; right: 10px; z-index: 50; padding: 5px 15px; font-size: 1rem; opacity: 0.7;">
        DÜZENLE
    </button>
    <!-- MODAL -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal-content">
            <!-- TIMER -->
            <div id="timer-container" class="timer-container">
                <div id="timer-display" class="timer-display">30</div>
                <button class="btn" id="btn-start-timer" onclick="app.startTimer()"
                    style="margin-top:15px; font-size:1.2rem;">Süreyi Başlat</button>
            </div>
            <div id="modal-question" class="modal-text">Soru</div>
            <div id="modal-answer" class="modal-answer">Cevap</div>
            <!-- SCORING -->
            <div id="modal-scoring" class="modal-scoring">
                <p
                    style="margin: 0 0 20px 0; font-size: 1.2rem; text-transform: uppercase; color: #fff; letter-spacing: 1px; text-align:center;">
                    Sadece Doğru Cevap Veren Takımları Seçin
                </p>
                <div class="modal-score-grid" id="modal-score-container"></div>
                <button class="btn btn-correct"
                    style="margin-top: 25px; width: 100%; border-radius: 8px; font-size: 2rem;"
                    onclick="app.applyScoresAndClose()">
                    Puanları Kaydet ve Devam Et
                </button>
            </div>
            <div style="margin-top:auto; padding-top: 30px; display:flex; gap:20px;">
                <button id="btn-reveal" class="btn btn-secondary" onclick="app.revealAnswer()">Cevabı Göster</button>
                <button id="btn-close" class="btn" onclick="app.closeModal()" style="display:none;">Kapat</button>
            </div>
        </div>
    </div>
    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCHgvgR60SgF04ZQlUCw1mWuJSZmDNViXI",
            authDomain: "lokum-buyuk-risk.firebaseapp.com",
            databaseURL: "https://lokum-buyuk-risk-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lokum-buyuk-risk",
            storageBucket: "lokum-buyuk-risk.firebasestorage.app",
            messagingSenderId: "242859600678",
            appId: "1:242859600678:web:7d7a149608e2aed7d16fe7",
            measurementId: "G-TL7CWLCE2B"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(f = 800, d = 150, t = 'square') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.type = t; osc.frequency.value = f; osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d / 1000); osc.stop(audioCtx.currentTime + d / 1000);
        }

        const app = {
            data: { title: "", catCount: 5, rowCount: 5, teamCount: 4, categories: [], questions: [] },
            scores: {}, // ← Bu değişken şimdi her yeni oyun için sıfırlanacak
            currentClue: null,
            timerInterval: null,
            timerValue: 0,
            selectedTeams: {},
            gamesList: [],
            gameListenerRef: null,
            isListOpen: false,

            init() {
                this.handleDimChange(); // Initialize builder with defaults
                this.loadGamesFromCloud(true);
            },

            // NEW FUNCTION: Creates a clean new game state
            createNewGame() {
                this.data = {
                    title: "Yeni Oyun",
                    catCount: 5,
                    rowCount: 5,
                    teamCount: 4,
                    categories: [],
                    questions: []
                };
                // ✅ CRITICAL FIX: Reset scores to empty for a brand-new game
                this.scores = {};

                document.getElementById('game-title').value = this.data.title;
                document.getElementById('cat-count').value = this.data.catCount;
                document.getElementById('row-count').value = this.data.rowCount;
                document.getElementById('team-count').value = this.data.teamCount;

                this.handleDimChange(false);
                this.showView('builder');
            },

            // NEW FUNCTION: Prepares current game for editing (preserves solved & scores)
            prepareEditForBuilder() {
                if (!this.data.id) {
                    this.createNewGame();
                    return;
                }
                document.getElementById('game-title').value = this.data.title || "Yeni Oyun";
                document.getElementById('cat-count').value = this.data.catCount;
                document.getElementById('row-count').value = this.data.rowCount;
                document.getElementById('team-count').value = this.data.teamCount;
                this.handleDimChange(true); // fillData=true → preserves solved states
                this.showView('builder');
            },

            showView(id) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById('view-' + id).classList.add('active');
                const isGame = id === 'game';
                document.getElementById('score-board').style.display = isGame ? 'flex' : 'none';
                document.getElementById('btn-edit-float').style.display = isGame ? 'block' : 'none';
            },

            toggleGameList() {
                const list = document.getElementById('local-games-list');
                const arrow = document.getElementById('arrow-icon');
                this.isListOpen = !this.isListOpen;
                if (this.isListOpen) {
                    list.style.display = 'block';
                    arrow.classList.add('rotated');
                    list.innerHTML = 'Yükleniyor...';
                    this.loadGamesFromCloud(false);
                } else {
                    list.style.display = 'none';
                    arrow.classList.remove('rotated');
                }
            },

            loadGamesFromCloud(initial = false) {
                const ref = db.ref('games').orderByChild('timestamp').limitToLast(100);
                if (initial) {
                    ref.once('value', snap => {
                        this.gamesList = [];
                        snap.forEach(c => {
                            const g = c.val(); g.id = c.key;
                            this.gamesList.push(g);
                        });
                        this.gamesList.reverse();
                    });
                    return;
                }
                ref.on('value', snap => {
                    this.gamesList = [];
                    snap.forEach(c => {
                        const g = c.val(); g.id = c.key;
                        this.gamesList.push(g);
                    });
                    this.gamesList.reverse();
                    if (this.isListOpen) this.renderGameList();
                });
            },

            renderGameList() {
                const container = document.getElementById('local-games-list');
                if (!this.isListOpen || !container) return;
                if (!this.gamesList.length) {
                    container.innerHTML = "Henüz kayıtlı oyun yok.";
                    return;
                }
                container.innerHTML = '';
                this.gamesList.forEach(g => {
                    const item = document.createElement('div');
                    item.style.cssText = "padding:12px; border:1px solid rgba(0,0,0,0.06); background:#fff; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;";
                    const info = document.createElement('div');
                    info.style.cursor = 'pointer';
                    info.innerHTML = `<strong>${g.title || 'Unnamed'}</strong><br><small style="color:#666">${new Date(g.timestamp).toLocaleString()} - ${g.teamCount || 4} Takım</small>`;
                    info.onclick = () => this.loadGame(g.id);
                    const actions = document.createElement('div');
                    actions.style.display = 'flex'; actions.style.gap = '8px';
                    const dup = document.createElement('button'); dup.className = 'btn'; dup.innerText = '📋'; dup.onclick = e => { e.stopPropagation(); this.duplicateGame(g.id); };
                    const play = document.createElement('button'); play.className = 'btn'; play.innerText = '▶'; play.onclick = e => { e.stopPropagation(); this.loadGame(g.id); };
                    const del = document.createElement('button'); del.className = 'btn'; del.innerText = '🗑'; del.onclick = e => { e.stopPropagation(); this.deleteGame(g.id); };
                    actions.append(dup, play, del);
                    item.append(info, actions);
                    container.appendChild(item);
                });
            },

            duplicateGame: async function (id) {
                try {
                    const snap = await db.ref(`games/${id}`).once('value');
                    if (!snap.exists()) return alert('Oyun bulunamadı.');
                    const orig = snap.val();
                    const payload = { ...orig, title: `Kopya: ${orig.title || 'Yeni Oyun'}`, timestamp: firebase.database.ServerValue.TIMESTAMP };
                    delete payload.id;
                    const newRef = db.ref('games').push();
                    payload.id = newRef.key;
                    await newRef.set(payload);
                    alert(`Oyun kopyalandı: ${payload.title}`);
                    if (this.isListOpen) this.loadGamesFromCloud(false);
                } catch (e) { console.error(e); alert('Kopyalama hatası'); }
            },

            loadGame(id) {
                if (this.gameListenerRef) this.gameListenerRef.off('value');
                this.gameListenerRef = db.ref(`games/${id}`);
                this.gameListenerRef.on('value', snap => {
                    if (!snap.exists()) return;
                    const g = snap.val();
                    this.data = g;
                    this.data.id = id;
                    this.scores = g.scores || {};
                    for (let i = 1; i <= (g.teamCount || 4); i++) if (this.scores[i] === undefined) this.scores[i] = 0;

                    document.getElementById('game-title').value = g.title || '';
                    document.getElementById('team-count').value = g.teamCount || 4;
                    document.getElementById('cat-count').value = g.catCount || 5;
                    document.getElementById('row-count').value = g.rowCount || 5;

                    if (g.questions) {
                        for (let c = 0; c < (g.catCount || 0); c++) {
                            for (let r = 0; r < (g.rowCount || 0); r++) {
                                if (!g.questions[c]) g.questions[c] = [];
                                if (!g.questions[c][r]) g.questions[c][r] = { q: '', a: '', val: (r + 1) * 100, solved: false };
                            }
                        }
                    }
                    this.data.questions = g.questions;
                    this.handleDimChange(true);
                    this.renderBoard();
                    this.renderScoreboard();
                    this.showView('game');

                    for (let i = 1; i <= (g.teamCount || 0); i++) {
                        const el = document.getElementById(`score-val-${i}`);
                        if (el) el.innerText = this.scores[i] || 0;
                    }
                });
            },

            deleteGame: async function (id) {
                if (!confirm("Silmek istediğinize emin misiniz?")) return;
                await db.ref(`games/${id}`).remove();
            },

            saveAndPlayGame: async function () {
                this.data.title = document.getElementById('game-title').value || 'Yeni Oyun';
                this.data.catCount = parseInt(document.getElementById('cat-count').value) || 5;
                this.data.rowCount = parseInt(document.getElementById('row-count').value) || 5;
                this.data.teamCount = parseInt(document.getElementById('team-count').value) || 4;

                // ✅ ADIM 1: Mevcut solved durumlarını geçici bir yapıda sakla
                const savedSolvedStates = [];
                for (let c = 0; c < (this.data.catCount || 0); c++) {
                    savedSolvedStates[c] = [];
                    for (let r = 0; r < (this.data.rowCount || 0); r++) {
                        savedSolvedStates[c][r] =
                            (this.data.questions?.[c]?.[r]?.solved !== undefined)
                                ? this.data.questions[c][r].solved
                                : false;
                    }
                }

                // ✅ ADIM 2: Yeni categories & questions dizilerini oluştur (solved olmadan)
                this.data.categories = [];
                for (let c = 0; c < this.data.catCount; c++) {
                    this.data.categories.push(document.getElementById(`cat-${c}`)?.value || `Kat ${c + 1}`);
                }

                this.data.questions = [];
                for (let c = 0; c < this.data.catCount; c++) {
                    this.data.questions[c] = [];
                    for (let r = 0; r < this.data.rowCount; r++) {
                        const qEl = document.getElementById(`q-${c}-${r}`);
                        const aEl = document.getElementById(`a-${c}-${r}`);
                        // ✅ ADIM 3: solved durumunu savedSolvedStates'ten al
                        const solved = savedSolvedStates[c]?.[r] ?? false;
                        this.data.questions[c][r] = {
                            q: qEl?.value || "Soru Girilmedi",
                            a: aEl?.value || "Cevap Girilmedi",
                            val: (r + 1) * 100,
                            solved: solved  // ← Şimdi kesinlikle korunuyor
                        };
                    }
                }

                // ... (geri kalan update/kaydet kısmı aynı kalır)
                const isUpdate = !!this.data.id;
                const ref = isUpdate ? db.ref(`games/${this.data.id}`) : db.ref('games').push();

                const payload = {
                    ...this.data,
                    id: isUpdate ? this.data.id : ref.key,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    scores: this.scores
                };

                if (isUpdate) {
                    delete payload.id;
                    await ref.update(payload);
                } else {
                    await ref.set(payload);
                }

                this.loadGame(payload.id);
                alert(`Oyun ${isUpdate ? 'güncellendi' : 'kaydedildi'}!`);
            },

            handleDimChange(fill = false) {
                const cc = parseInt(document.getElementById('cat-count').value);
                const rc = parseInt(document.getElementById('row-count').value);
                const area = document.getElementById('builder-grid-area');

                // Kategoriler
                const newCategories = Array(cc).fill().map((_, i) =>
                    fill && this.data.categories?.[i] ? this.data.categories[i] : `Kat ${i + 1}`
                );

                // Sorular: Her seviyede fallback ile güvenli erişim
                const newQuestions = Array(cc).fill().map((_, c) => {
                    const catQs = this.data.questions?.[c] || [];
                    return Array(rc).fill().map((_, r) => {
                        const existingQ = catQs[r] || {};
                        // ✅ En önemli kısım: solved durumu eksikse false değil, mevcutsa koru
                        const solved = existingQ.solved !== undefined ? existingQ.solved : false;
                        return {
                            q: existingQ.q || "",
                            a: existingQ.a || "",
                            val: (r + 1) * 100,
                            solved: solved // ← Bu satır kritik: never reset to false if it was true
                        };
                    });
                });

                this.data.categories = newCategories;
                this.data.questions = newQuestions;

                // HTML generation (aynı kalır)
                let html = `<div class="category-row" style="display:grid;grid-template-columns:repeat(${cc},1fr);gap:10px;">`;
                for (let c = 0; c < cc; c++) {
                    html += `<input type="text" id="cat-${c}" placeholder="Kategori ${c + 1}" value="${this.data.categories[c]}">`;
                }
                html += `</div><div class="questions-grid" style="display:grid;grid-template-columns:repeat(${cc},1fr);gap:10px;">`;
                for (let r = 0; r < rc; r++) {
                    for (let c = 0; c < cc; c++) {
                        const val = (r + 1) * 100;
                        const qVal = this.data.questions[c][r].q;
                        const aVal = this.data.questions[c][r].a;
                        html += `<div class="q-cell"><div style="text-align:center;font-weight:bold">${val}</div><input id="q-${c}-${r}" placeholder="Soru" value="${qVal}"><input id="a-${c}-${r}" placeholder="Cevap" value="${aVal}"></div>`;
                    }
                }
                html += `</div>`;
                area.innerHTML = html;
            },

            startGame() {
                this.renderBoard();
                this.renderScoreboard();
                this.showView('game');
            },

            renderBoard() {
                const grid = document.getElementById('game-grid');
                grid.innerHTML = '';
                grid.style.gridTemplateColumns = `repeat(${this.data.catCount}, 1fr)`;
                grid.style.gridTemplateRows = `auto repeat(${this.data.rowCount}, 1fr)`;
                this.data.categories.forEach(cat => {
                    const d = document.createElement('div');
                    d.className = 'category-card'; d.innerText = cat; grid.appendChild(d);
                });
                for (let r = 0; r < this.data.rowCount; r++) {
                    for (let c = 0; c < this.data.catCount; c++) {
                        const q = this.data.questions[c][r] || { val: (r + 1) * 100, solved: false };
                        const d = document.createElement('div');
                        d.className = `clue-card ${q.solved ? 'disabled' : ''}`;
                        d.innerText = q.solved ? '' : q.val;
                        d.onclick = () => this.openClue(c, r);
                        grid.appendChild(d);
                    }
                }
            },

            renderScoreboard() {
                const con = document.getElementById('score-container');
                con.innerHTML = '';
                for (let i = 1; i <= this.data.teamCount; i++) {
                    const d = document.createElement('div');
                    d.className = 'score-team';
                    const s = this.scores[i] ?? 0;
                    d.innerHTML = `<span>Takım ${i}</span><button class="score-adjust-btn plus" onclick="app.manualScore(${i},100)">▲</button><span id="score-val-${i}" class="score-val">${s}</span><button class="score-adjust-btn minus" onclick="app.manualScore(${i},-100)">▼</button>`;
                    con.appendChild(d);
                }
            },

            manualScore(tid, amt) {
                this.scores[tid] = (this.scores[tid] || 0) + amt;
                const el = document.getElementById(`score-val-${tid}`);
                if (el) {
                    el.innerText = this.scores[tid];
                    el.style.transform = 'scale(1.4)'; el.style.color = 'white';
                    setTimeout(() => { el.style.transform = 'scale(1)'; el.style.color = 'var(--accent-red)'; }, 150);
                    if (this.data.id) db.ref(`games/${this.data.id}/scores`).set(this.scores);
                }
            },

            openClue(c, r) {
                const q = this.data.questions[c][r];
                if (q.solved) return;
                this.currentClue = { c, r, val: q.val };
                this.selectedTeams = {};

                document.getElementById('modal-question').innerText = q.q;
                document.getElementById('modal-answer').innerText = q.a;
                document.getElementById('modal-answer').style.display = 'none';
                document.getElementById('modal-scoring').style.display = 'none';
                document.getElementById('btn-reveal').style.display = 'inline-block';
                document.getElementById('btn-close').style.display = 'none';

                const tCont = document.getElementById('timer-container');
                if (q.val < 500) {
                    tCont.style.display = 'flex';
                    this.timerValue = 30;
                    document.getElementById('timer-display').innerText = '30';
                    document.getElementById('btn-start-timer').style.display = 'inline-block';
                    document.getElementById('timer-display').className = 'timer-display';
                } else {
                    tCont.style.display = 'none';
                    this.timerValue = 0;
                }

                const grid = document.getElementById('modal-score-container');
                grid.innerHTML = '';
                for (let i = 1; i <= this.data.teamCount; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'team-toggle-btn';
                    btn.id = `team-toggle-${i}`;
                    btn.innerText = `Takım ${i}`;
                    btn.onclick = () => app.toggleTeam(i);
                    grid.appendChild(btn);
                }

                document.getElementById('game-modal').style.display = 'flex';
            },

            toggleTeam(tid) {
                this.selectedTeams[tid] = !this.selectedTeams[tid];
                const btn = document.getElementById(`team-toggle-${tid}`);
                if (this.selectedTeams[tid]) btn.classList.add('selected');
                else btn.classList.remove('selected');
            },

            applyScoresAndClose() {
                if (!this.currentClue) return;
                const val = this.currentClue.val;
                for (let i = 1; i <= this.data.teamCount; i++) {
                    if (this.selectedTeams[i]) {
                        this.scores[i] = (this.scores[i] || 0) + val;
                        const el = document.getElementById(`score-val-${i}`);
                        if (el) {
                            el.innerText = this.scores[i];
                            el.style.transform = 'scale(1.4)';
                            setTimeout(() => el.style.transform = 'scale(1)', 200);
                        }
                    }
                }
                if (this.data.id) db.ref(`games/${this.data.id}/scores`).set(this.scores);
                this.closeModal();
            },

            startTimer() {
                document.getElementById('btn-start-timer').style.display = 'none';
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.timerValue--;
                    const disp = document.getElementById('timer-display');
                    disp.innerText = this.timerValue;
                    if (this.timerValue <= 10 && this.timerValue > 0) {
                        disp.classList.add('timer-warning');
                        playBeep(600, 150, 'square');
                    } else if (this.timerValue === 0) {
                        playBeep(300, 800, 'square');
                        disp.innerText = 'BİTTİ';
                        clearInterval(this.timerInterval);
                    }
                }, 1000);
            },

            revealAnswer() {
                clearInterval(this.timerInterval);
                document.getElementById('modal-answer').style.display = 'block';
                document.getElementById('modal-scoring').style.display = 'block';
                document.getElementById('btn-reveal').style.display = 'none';
                document.getElementById('btn-close').style.display = 'inline-block';
            },

            closeModal() {
                clearInterval(this.timerInterval);
                if (this.currentClue) {
                    const { c, r } = this.currentClue;
                    this.data.questions[c][r].solved = true;
                    this.renderBoard();
                    if (this.data.id) {
                        db.ref(`games/${this.data.id}/questions/${c}/${r}/solved`).set(true);
                    }
                }
                document.getElementById('game-modal').style.display = 'none';
            },

            loadHardcodedDemo: async function () {
                const demoData = {
                    title: "Örnek Oyun",
                    catCount: 5,
                    rowCount: 5,
                    teamCount: 4,
                    categories: ["Coğrafya", "Tarih", "Spor", "Bilim", "Genel"],
                    questions: []
                };

                for (let c = 0; c < 5; c++) {
                    demoData.questions[c] = [];
                    for (let r = 0; r < 5; r++) {
                        demoData.questions[c][r] = {
                            q: `${demoData.categories[c]} - ${(r + 1) * 100} Puanlık Soru`,
                            a: "Örnek Cevap",
                            val: (r + 1) * 100,
                            solved: false
                        };
                    }
                }

                const ref = db.ref('games').push();
                const scores = {}; for (let i = 1; i <= 4; i++) scores[i] = 0;
                await ref.set({
                    ...demoData,
                    id: ref.key,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    scores: scores
                });

                this.loadGame(ref.key);
            }
        };

        window.app = app;
        window.addEventListener('load', () => app.init());
    </script>
</body>
