<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokum | Success!</title>
    <link rel="icon" type="image/x-icon" href="Logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Ottoma';
            /* 'n' harfini kaldırarak ana sayfa ile aynı yapın  */
            src: local('Ottoma'), url('./Ottoma.otf') format('opentype');
            /* Dosya isminin klasörünüzdekiyle aynı olduğundan emin olun  */
        }

        :root {
            --retro-bg: #ffffff;
            --lokum-red: #c41821;
            --lokum-purple: #2c2f73;
            --shadow-hard: 4px 4px 0px 0px #000;
        }

        body {
            background-color: var(--retro-bg);
            font-family: 'Source Sans 3', sans-serif;
            background-image: radial-gradient(rgba(44, 47, 115, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .retro-font {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
        }

        .ottoman-font {
            font-family: 'Ottoma', sans-serif;
        }

        .box-retro {
            border: 3px solid black;
            background: white;
            box-shadow: var(--shadow-hard);
        }

        .btn-retro {
            display: inline-block;
            background-color: var(--lokum-red);
            color: white;
            border: 3px solid black;
            padding: 10px 25px;
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            box-shadow: var(--shadow-hard);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-retro:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0px 0px #000;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full text-center">
        <div class="box-retro p-8 md:p-12 relative">
            <div class="ottoman-font text-5xl mb-4 text-[var(--lokum-purple)]">Lokum</div>

            <h1 class="retro-font text-5xl md:text-7xl mb-6">
                <span data-i18n="success_title"
                    class="bg-[var(--lokum-red)] text-white px-4 py-2 transform -rotate-2 inline-block border-4 border-black">SUCCESS!</span>
            </h1>

            <p id="success-msg-container" class="text-xl md:text-2xl font-bold mb-8 leading-tight">
                Fetching details...
            </p>

            <div data-i18n="success_inbox"
                class="bg-gray-100 p-4 border-2 border-black font-sans font-medium text-sm md:text-base mb-8 leading-relaxed">
                📩 Check your inbox! Your QR code ticket has been sent to your email. You will need it at the door.
            </div>

            <a data-i18n="back_home" href="index.html" class="btn-retro bg-[var(--lokum-purple)] w-full text-center">
                BACK TO HOME
            </a>
        </div>

        <p class="mt-8 font-mono text-xs uppercase tracking-widest opacity-50">Brussels • Culture • Community</p>
    </div>

    <script>
        // 1. Supabase browser-safe anon key
        const supabaseUrl = 'https://iltykikjbbqbsgbyidpu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsdHlraWtqYmJxYnNnYnlpZHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDUxNzMsImV4cCI6MjA5Mjk4MTE3M30.DZgfpPju6x_nJApp1PxlkTPOUv7Du8GDcv3iyNv1mkw';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Stripe Hata/İptal Kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        if (['failed', 'canceled', 'requires_payment_method'].includes(urlParams.get('redirect_status'))) {
            window.location.replace('cancel.html');
        }

        // 3. Çeviri Şablonları ({event} yer tutucusu ile)
        const pageTranslations = {
            en: {
                success_title: "SUCCESS!",
                success_msg: "Your spot for {event} is confirmed!",
                success_inbox: "📩 Check your inbox! Your QR code ticket has been sent to your email. You will need it at the door.",
                back_home: "BACK TO HOME"
            },
            tr: {
                success_title: "BAŞARILI!",
                success_msg: "{event} yeriniz onaylandı!",
                success_inbox: "📩 Gelen kutunuzu kontrol edin! QR kod biletiniz e-posta adresinize gönderildi. Kapıda ihtiyacınız olacak.",
                back_home: "ANA SAYFAYA DÖN"
            },
            nl: {
                success_title: "GELUKT!",
                success_msg: "Je plek voor {event} is bevestigd!",
                success_inbox: "📩 Check je inbox! Je QR-code ticket is naar je e-mail verzonden. Je hebt het nodig aan de door.",
                back_home: "TERUG NAAR HOME"
            },
            fr: {
                success_title: "SUCCÈS!",
                success_msg: "Votre place pour {event} est confirmée !",
                success_inbox: "📩 Vérifiez votre boîte de réception ! Votre billet QR code a été envoyé par e-mail. Vous en aurez besoin à l'entrée.",
                back_home: "RETOUR À L'ACCUEIL"
            }
        };

        // 4. Veritabanından O ANKİ Başlığı Çek ve Sayfayı Güncelle
        async function initSuccessPage() {
            const savedLang = localStorage.getItem('lokumLang') || 'en';
            let eventTitle = "Bizbize2"; // Eğer çekilemezse görünecek çok kısa fallback

            try {
                // Veritabanındaki banner_config tablosundan güncel başlığı çekiyoruz 
                const { data, error } = await _supabase
                    .from('banner_config')
                    .select('title_text')
                    .eq('id', 1)
                    .single();

                if (data && data.title_text) {
                    eventTitle = data.title_text; // Örn: "LOKUM TEST"
                }
            } catch (err) {
                console.error("Database fetch error:", err);
            }

            // Statik dilleri çevir
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (pageTranslations[savedLang][key]) {
                    el.innerText = pageTranslations[savedLang][key];
                }
            });

            // Etkinlik ismini (Örn: LOKUM TEST) mesajın içine yerleştir
            const template = pageTranslations[savedLang].success_msg;
            const finalHtml = template.replace('{event}', `<span class="text-[var(--lokum-purple)] underline decoration-4">${eventTitle}</span>`);
            document.getElementById('success-msg-container').innerHTML = finalHtml;
        }

        document.addEventListener("DOMContentLoaded", initSuccessPage);
    </script>
</body>

</html>
